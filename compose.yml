services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: labreserve
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/labreserve
    ports:
      - 3000:3000
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - next-cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  node-modules:
  next-cache:
